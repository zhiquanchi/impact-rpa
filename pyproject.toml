[project]
name = "impact-rpa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "drissionpage>=4.1.1.2",
    "google-genai>=2.2.0",
    "loguru>=0.7.3",
    "mitmproxy>=12.2.3",
    "plyer>=2.1.0",
    "pydantic>=2.7.0",
    "pyperclip>=1.11.0",
    "pyqt6>=6.11.0",
    "questionary>=2.1.1",
    "rich>=14.2.0",
]

[project.optional-dependencies]
vision = [
    "openai>=1.0.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/test_partner_groups_comparison.py" = ["E402"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
exclude = [
    ".venv",
    "scripts/**",
    "domain/**",
    "infra/**",
    "ui/**",
]
